<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Список покупок</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: -apple-system, sans-serif; 
    background: #f5f5f5; 
    padding-bottom: 100px;
  }

  .header {
    background: white;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header h1 {
    font-size: 24px;
    margin-bottom: 15px;
  }

  .btn-row {
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-photo { background: #2196F3; color: white; }
  .btn-reset { background: #757575; color: white; }
  .btn:active { transform: scale(0.95); }

  .stats {
    background: white;
    margin: 15px;
    padding: 15px;
    border-radius: 12px;
    display: flex;
    justify-content: space-around;
  }

  .stat-num {
    font-size: 28px;
    font-weight: 700;
  }

  .stat-label {
    font-size: 12px;
    color: #888;
    margin-top: 4px;
  }

  .stat-num.red { color: #e53935; }
  .stat-num.green { color: #43a047; }

  .section {
    margin: 15px;
  }

  .section-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 10px;
    color: #555;
  }

  .product-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .product {
    background: white;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    border-left: 5px solid transparent;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }

  .product:active { transform: scale(0.96); }

  .product.need {
    border-left-color: #e53935;
    background: #fff5f5;
  }

  .product.need .name {
    color: #c62828;
    font-weight: 700;
  }

  .product.need .dot {
    background: #e53935;
  }

  .product.ok {
    border-left-color: #43a047;
    background: #f1f8e9;
    opacity: 0.7;
  }

  .product.ok .name {
    color: #2e7d32;
    text-decoration: line-through;
    font-weight: 600;
  }

  .product.ok .dot {
    background: #43a047;
  }

  .product .name {
    font-size: 15px;
    flex: 1;
  }

  .product .dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    font-weight: bold;
  }

  .success {
    display: none;
    background: linear-gradient(135deg, #43a047, #66bb6a);
    color: white;
    margin: 15px;
    padding: 30px;
    border-radius: 16px;
    text-align: center;
    animation: popIn 0.5s ease;
  }

  .success .emoji { font-size: 60px; margin-bottom: 10px; }
  .success .text { font-size: 24px; font-weight: 700; }

  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  #cameraInput { display: none; }
</style>
</head>
<body>

<div class="header">
  <h1>🛒 Список покупок</h1>
  <div class="btn-row">
    <button class="btn btn-photo" onclick="document.getElementById('cameraInput').click()"> Сфоткать</button>
    <button class="btn btn-reset" onclick="resetAll()">🔄 Сбросить</button>
  </div>
</div>

<div class="stats">
  <div>
    <div class="stat-num red" id="needCount">0</div>
    <div class="stat-label">Нужно купить</div>
  </div>
  <div>
    <div class="stat-num green" id="okCount">0</div>
    <div class="stat-label">Куплено</div>
  </div>
</div>

<div class="success" id="successMsg">
  <div class="emoji">🎉</div>
  <div class="text">Ты всё купил!</div>
</div>

<div class="section">
  <div class="section-title">🥬 Овощи и мясо</div>
  <div class="product-list" id="list1"></div>
</div>

<div class="section">
  <div class="section-title">🥛 Молочные продукты</div>
  <div class="product-list" id="list2"></div>
</div>

<div class="section">
  <div class="section-title">🍎 Фрукты и другое</div>
  <div class="product-list" id="list3"></div>
</div>

<input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handlePhoto(event)">

<script>
  // Продукты разделены по категориям
  const categories = {
    list1: ["Хлеб", "Картофель", "Лук", "Морковь", "Курица", "Мясо", "Фарш", "Рыба", "Помидоры", "Огурцы", "Капуста", "Чеснок"],
    list2: ["Молоко", "Яйца", "Сыр", "Сметана", "Кефир", "Творог", "Йогурт", "Колбаса", "Сосиски", "Сливки", "Масло", "Майонез"],
    list3: ["Яблоки", "Бананы", "Макароны", "Рис", "Гречка", "Каша", "Мука", "Сахар", "Соль", "Чай", "Кофе", "Вода", "Сок", "Печенье", "Шоколад", "Кетчуп", "Авокадо", "Пельмени", "Лимон", "Виноград"]
  };

  let items = {};

  function loadState() {
    const saved = localStorage.getItem('shoppingItems');
    if (saved) {
      items = JSON.parse(saved);
    } else {
      // По умолчанию всё красное (нужно купить)
      Object.values(categories).flat().forEach(p => items[p] = false);
    }
  }

  function saveState() {
    localStorage.setItem('shoppingItems', JSON.stringify(items));
  }

  function handlePhoto(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    // При фото просто сбрасываем всё на красное (нужно купить)
    Object.values(categories).flat().forEach(p => items[p] = false);
    saveState();
    renderAll();
    e.target.value = '';
  }

  function toggleItem(name) {
    items[name] = !items[name];
    saveState();
    renderAll();
  }

  function markAllNeed() {
    Object.values(categories).flat().forEach(p => items[p] = false);
    saveState();
    renderAll();
  }

  function markAllOk() {
    Object.values(categories).flat().forEach(p => items[p] = true);
    saveState();
    renderAll();
  }

  function resetAll() {
    if (confirm('Сбросить всё на красное (нужно купить)?')) {
      markAllNeed();
    }
  }

  function renderList(containerId, products) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    
    products.forEach(name => {
      const isOk = items[name] === true;
      const div = document.createElement('div');
      div.className = 'product ' + (isOk ? 'ok' : 'need');
      div.onclick = () => toggleItem(name);
      div.innerHTML = `
        <span class="name">${name}</span>
        <span class="dot">${isOk ? '✓' : '✗'}</span>
      `;
      container.appendChild(div);
    });
  }

  function renderAll() {
    renderList('list1', categories.list1);
    renderList('list2', categories.list2);
    renderList('list3', categories.list3);

    const allProducts = Object.values(categories).flat();
    const okCount = allProducts.filter(p => items[p] === true).length;
    const needCount = allProducts.length - okCount;

    document.getElementById('okCount').textContent = okCount;
    document.getElementById('needCount').textContent = needCount;

    const successMsg = document.getElementById('successMsg');
    if (okCount === allProducts.length && allProducts.length > 0) {
      successMsg.style.display = 'block';
    } else {
      successMsg.style.display = 'none';
    }
  }

  // Запуск
  loadState();
  renderAll();
</script>
</body>
</html>
